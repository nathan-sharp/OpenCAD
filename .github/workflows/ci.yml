name: OCIS Validation and Interop Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install CMake and C++ Compiler
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Run Python Validation Script
        run: python scripts/validate_repo.py

      - name: Build C++ Parser and Tests
        run: |
          cd parsers/cpp
          mkdir build
          cd build
          cmake ..
          make

      - name: Run C++ Parser Tests
        run: |
          cd parsers/cpp/build
          ctest --output-on-failure

      - name: Run Python-C++ Interoperability Tests
        run: python scripts/test_interop.py
